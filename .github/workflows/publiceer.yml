# Lesbord — controleert alle lessen en zet de site online (GitHub Pages).
# Klopt een les niet, dan stopt het hier en blijft de vorige versie van de site staan.
# Eenmalig instellen: Settings → Pages → Source: "GitHub Actions".
name: Controleren en publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publiceer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lessen controleren en overzicht maken
        run: python tools/controleer.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
