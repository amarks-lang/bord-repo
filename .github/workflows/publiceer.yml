# Lesbord — controleert bij elke push alle lessen.
# De site zelf komt online via GitHub Pages (Settings → Pages → Deploy from a branch: main, / (root)).
# Gaat deze controle mis, dan krijg je een mail: draai dan `python3 tools/controleer.py` en herstel de les.
name: Lessen controleren

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controleer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lessen controleren
        run: python tools/controleer.py

      - name: Is het overzicht bijgewerkt?
        run: |
          if ! git diff --quiet -- lessen/catalogus.json; then
            echo "::error::lessen/catalogus.json is niet bijgewerkt. Draai python3 tools/controleer.py en commit het resultaat."
            exit 1
          fi
